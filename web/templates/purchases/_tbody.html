{{define "purchases_tbody"}}
<tbody id="purchases-tbody">
  {{range .Purchases}}
    <tr>
      <td>{{.TransactionDate.Format "2006-01-02"}}</td>
      <td>{{.ProductCategory}}</td>
      <td>{{.ProductName}}</td>
      <td class="num">{{.Quantity}}</td>
      <td>{{.PaymentMethod}}</td>
      <td>{{.Memo}}</td>
      <td>
        <div class="btn-row">
          <button class="secondary outline"
                  hx-get="/purchases/{{.ID}}/edit"
                  hx-target="#modal-body"
                  hx-swap="innerHTML">
            수정
          </button>
          <button class="contrast outline"
                  hx-delete="/purchases/{{.ID}}"
                  hx-target="#purchases-tbody"
                  hx-swap="outerHTML"
                  hx-confirm="이 매입을 삭제하시겠습니까? 재고도 함께 차감됩니다.">
            삭제
          </button>
        </div>
      </td>
    </tr>
  {{else}}
    <tr>
      <td colspan="7" style="text-align: center; padding: 2rem;">
        <em>등록된 매입이 없습니다. '신규 등록' 버튼으로 추가해주세요.</em>
      </td>
    </tr>
  {{end}}
</tbody>
{{end}}
