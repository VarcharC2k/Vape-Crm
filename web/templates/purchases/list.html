{{define "page"}}
<header style="display: flex; justify-content: space-between; align-items: center;">
  <hgroup>
    <h1>매입 관리</h1>
    <p id="purchase-count">표시 매입 {{len .Purchases}}건</p>
  </hgroup>
  <button
    hx-get="/purchases/new"
    hx-target="#modal-body"
    hx-swap="innerHTML">
    신규 등록
  </button>
</header>

{{/*
  매입 검색 필터 — 년/월 단위.
  <input type="month"> 는 'YYYY-MM' 형식 값을 보냄. 비우면 전체.
  값 변경 시 HTMX 로 tbody 만 갱신.
*/}}
<div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem;">
  <label for="filter-month" style="margin: 0;">조회 월:</label>
  <input id="filter-month" name="q_month" type="month"
         hx-get="/purchases/"
         hx-target="#purchases-tbody"
         hx-swap="outerHTML"
         hx-trigger="change"
         style="margin: 0; max-width: 12rem;">
  <small style="color: var(--pico-muted-color);">비우면 전체</small>
</div>

<table>
  <thead>
    <tr>
      <th>날짜</th>
      <th>분류</th>
      <th>품목</th>
      <th class="num">수량</th>
      <th>결제수단</th>
      <th>비고</th>
      <th style="width: 8rem;">관리</th>
    </tr>
  </thead>
  {{template "purchases_tbody" .}}
</table>

{{/* 모달: 등록·수정 폼이 hx-get 으로 들어오는 자리 */}}
<dialog id="modal">
  <article style="min-width: min(36rem, 95vw);">
    <header>
      <button
        aria-label="Close"
        rel="prev"
        onclick="document.getElementById('modal').close()"></button>
      <strong id="modal-title">매입</strong>
    </header>
    <div id="modal-body"><!-- HTMX 가 폼을 여기에 주입 --></div>
  </article>
</dialog>

<script>
  // 모달 body 에 새 HTML 이 들어오면 자동으로 dialog 열기
  document.body.addEventListener('htmx:afterSwap', function (evt) {
    if (evt.detail.target && evt.detail.target.id === 'modal-body') {
      document.getElementById('modal').showModal();
    }
  });

  // 저장 성공 시 서버가 HX-Trigger: purchase-saved 를 보내면 모달 닫기
  document.body.addEventListener('purchase-saved', function () {
    document.getElementById('modal').close();
  });

  // 등록/수정/삭제 후 서버가 보낸 새 카운트로 상단 텍스트 갱신
  document.body.addEventListener('purchase-count-changed', function (evt) {
    const el = document.getElementById('purchase-count');
    if (el) el.textContent = '표시 매입 ' + evt.detail.value + '건';
  });
</script>
{{end}}
